# /etc/systemd/user/plasma-kwin_wayland.service.d/y700-wait-sensors.conf (2026-10-16)
# KWin finds the orientation sensor only at start: wait (<= 10 s) for iio-sensor-proxy first.
# Undo: rm this file; systemctl --user daemon-reload (takes effect at the next login).
[Service]
ExecStartPre=-/usr/local/libexec/y700-wait-sensor-proxy
