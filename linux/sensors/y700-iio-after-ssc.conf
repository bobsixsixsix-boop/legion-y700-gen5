# /etc/systemd/system/iio-sensor-proxy.service.d/y700-iio-after-ssc.conf (2026-10-16)
# Start the sensor proxy only once the ADSP sensor core is attached (y700-wait-ssc). (A Before=display-manager
# here formed an ordering cycle via hexagonrpcd -> multi-user.target -> fcitx5-osk-key-helper -> sddm; removed.) A boot where the
# proxy loses the race leaves auto-rotation dead for the whole session (KWin does not look again) and the
# control centre's rotation-lock tile cannot unlock. KWin itself waits for the proxy (y700-kwin-wait-sensors.conf);
# Undo: rm this file and /usr/local/libexec/y700-wait-ssc; systemctl daemon-reload.
[Unit]
After=hexagonrpcd.service tb323fu-dsp.service

[Service]
ExecStartPre=/usr/local/libexec/y700-wait-ssc
TimeoutStartSec=45
