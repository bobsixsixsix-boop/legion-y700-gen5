[package]
name = "y700-gamepad-screen"
version = "0.1.0"
edition = "2021"
description = "y700: G9 2026 lighting off with the screen, and the screen back on from a G9 button"
publish = false

# Built offline on the tablet against Ubuntu's packaged crates (.cargo/config.toml points crates-io at
# /usr/share/cargo/registry), like linux/gamepad/padkeys. serde/serde_json keep the Python version's state.json.
[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "y700-gamepad-screen"
path = "src/main.rs"

[profile.release]
opt-level = 3
strip = true
