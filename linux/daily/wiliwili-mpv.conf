# ~/.config/wiliwili/mpv.conf  -- y700, 2026-10-13
# wiliwili starts libmpv with config=yes and config-dir=~/.config/wiliwili (source/view/mpv_core.cpp), so
# THIS file is the only mpv.conf it reads (never ~/.config/mpv/mpv.conf). Options set in code win over it
# (hwdec comes from player_hwdec_custom in wiliwili_config.json, not from here).
#
# 1) Log every run so a "picture frozen, audio keeps playing" stall can be read afterwards. The file is
#    rewritten at each start; at these levels it stays a few MB per hour.
log-file=~/.cache/wiliwili-mpv.log
msg-level=all=warn,cplayer=info,vd=v,vo=v,lavf=v,stream=v,demux=v,ffmpeg=v
#
# 2) Bilibili plays video and audio from two separate HTTPS connections. If the video one hangs (no EOF,
#    no error), libavformat blocks on read: audio goes on from its own cache, the picture stops on the
#    last frame and nothing in the app reacts. Reconnect instead of blocking forever.
#    The read timeout itself is NOT set here: wiliwili passes network-timeout=5 as a per-file option on
#    every loadfile (source/view/video_view.cpp genExtraUrlParam), and a file-local option always wins
#    over this file, so a value here would only mislead. 5 s is the effective cap.
stream-lavf-o=reconnect=1,reconnect_streamed=1,reconnect_on_network_error=1,reconnect_delay_max=5
