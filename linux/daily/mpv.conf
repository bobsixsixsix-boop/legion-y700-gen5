# y700: Qualcomm iris decoder through VA-API (libva-v4l2 + iris decode-order kernel patch, kernel -t47-y2):
# zero-copy dmabuf into gpu-next, 10-bit (P010) included. Old v4l2m2m-copy kept as a fallback: it is
# 8-bit only (FFmpeg asks the capture side for NV12). AV1 has no hardware path -> software.
hwdec=vaapi,vaapi-copy,v4l2m2m-copy
hwdec-codecs=h264,hevc,vp9
vo=gpu-next
