<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Y700 多任务卡片</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f4f6; --surface:#ffffff; --ink:#15171a; --ink-2:#5b616b; --ink-3:#6a7079; --line:#e2e4e8;
  --accent:#2e6bf6; --accent-soft:rgba(46,107,246,.10); --chip:#eceef1;
  --font:"Noto Sans SC","Noto Sans CJK SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"Noto Sans Mono",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1013; --surface:#16191e; --ink:#eef0f3; --ink-2:#a2a8b2; --ink-3:#7b828d; --line:#262a31;
    --accent:#5486f8; --accent-soft:rgba(84,134,248,.14); --chip:#1f232a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1013; --surface:#16191e; --ink:#eef0f3; --ink-2:#a2a8b2; --ink-3:#7b828d; --line:#262a31;
  --accent:#5486f8; --accent-soft:rgba(84,134,248,.14); --chip:#1f232a; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1280px;margin:0 auto;padding:28px 16px 64px}
header.top h1{font-size:24px;font-weight:700;margin:0;letter-spacing:.01em}
header.top p{margin:6px 0 0;color:var(--ink-2);max-width:820px}

/* controls */
.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:22px 0 14px}
.group{display:flex;align-items:center;gap:8px}
.group > .lbl{font-size:13px;color:var(--ink-3)}
.seg{display:inline-flex;background:var(--chip);border-radius:10px;padding:3px}
.seg button,.btn{font:inherit;font-size:14px;font-weight:500;border:0;background:transparent;color:var(--ink-2);padding:6px 12px;border-radius:8px;cursor:pointer;min-height:34px;transition:background-color .15s ease,color .15s ease,transform .16s cubic-bezier(.23,1,.32,1)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.btn{background:#2e6bf6;color:#fff;padding:6px 16px}
.btn.ghost{background:var(--chip);color:var(--ink)}
.seg button:active,.btn:active{transform:scale(.97)}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2);cursor:pointer;user-select:none}
.toggle input{width:16px;height:16px;accent-color:var(--accent);margin:0}

/* the tablet */
.stage{display:flex;flex-direction:column;align-items:center}
.device{background:#0b0c0e;border-radius:30px;padding:14px;box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 20px 50px -30px rgba(0,0,0,.45)}
.viewport{position:relative;overflow:hidden;border-radius:18px;background:#000}
.screen{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;cursor:default;font-family:var(--font);color:#fff;contain:strict}
.hint{color:var(--ink-3);font-size:13px;margin:12px 0 0;text-align:center;max-width:860px}
.note{color:var(--ink-2);font-size:13px;margin:8px 0 0;text-align:center}
.note:empty{display:none}

/* screen layers */
.layer{position:absolute;left:0;top:0;width:100%;height:100%}
.desk{will-change:opacity}
.desk-blur{opacity:0;will-change:opacity}
.desk-blur .blurred{position:absolute;inset:0;filter:blur(36px) saturate(150%)}
.desk-blur .bw{position:absolute;inset:0;transform:scale(1.12)}   /* only the wallpaper is overscanned, so the blur has no soft edge; the icons stay put */
.desk-blur .shade{position:absolute;inset:0;background:rgba(22,24,30,.30)}
.wall{position:absolute;inset:0}
.wall svg{width:100%;height:100%;display:block}
.dicons{position:absolute;left:28px;top:26px;display:grid;grid-auto-flow:row;gap:18px}
.dicon{width:92px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:14px;text-shadow:0 1px 2px rgba(0,0,0,.45)}
.dicon i{width:56px;height:56px;border-radius:14px;display:grid;place-items:center}
.panel{position:absolute;left:0;right:0;bottom:0;height:52px;background:rgba(18,20,26,.72);display:flex;align-items:center;justify-content:center;gap:14px;border-top:1px solid rgba(255,255,255,.06)}
.panel i{width:36px;height:36px;border-radius:9px;display:grid;place-items:center}
.panel .clock{position:absolute;right:18px;font-size:15px;font-weight:500;color:rgba(255,255,255,.88)}
.panel .launcher{position:absolute;left:14px;opacity:.9}

.stack{transform-origin:0 0;will-change:transform,opacity}
.card{position:absolute;left:0;top:0;transform-origin:0 50%;will-change:transform,opacity}
.card .shadow{position:absolute;inset:0;border-radius:18px;box-shadow:-14px 0 40px rgba(0,0,0,.42),0 10px 34px rgba(0,0,0,.20);opacity:0}
.card .shot{position:absolute;inset:0;border-radius:18px;overflow:hidden;background:#222;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.card .shot > .a{position:absolute;left:0;top:0;transform-origin:0 0}
.card .dim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
.card .head{position:absolute;left:9px;bottom:100%;margin-bottom:10px;display:flex;align-items:center;gap:10px;height:30px;white-space:nowrap}
.card .head .ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.10) inset}
.card .head .nm{font-size:16px;font-weight:600;letter-spacing:.01em;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.card .head .tag{font-size:13px;font-weight:500;color:rgba(255,255,255,.86);background:rgba(255,255,255,.16);border-radius:7px;padding:1px 8px}
.card .armed{position:absolute;left:50%;bottom:28px;transform:translateX(-50%) scale(.96);opacity:0;background:rgba(255,59,48,.94);color:#fff;font-size:18px;font-weight:600;padding:10px 20px 12px;border-radius:14px;white-space:nowrap;overflow:hidden;transition:opacity .16s cubic-bezier(.33,1,.68,1),transform .16s cubic-bezier(.33,1,.68,1);pointer-events:none}
.card .armed.on{opacity:1;transform:translateX(-50%) scale(1)}
.card .armed .bar{position:absolute;left:0;bottom:0;height:3px;width:100%;background:rgba(255,255,255,.55);transform-origin:0 50%}
.card .armed.on .bar{animation:countdown 3s linear forwards}
@keyframes countdown{from{transform:scaleX(1)}to{transform:scaleX(0)}}

.chrome{pointer-events:none}
.clear{position:absolute;left:50%;top:0;transform:translate(-50%,-50%);padding:6px;border:0;background:transparent;font:inherit;color:#fff;cursor:pointer;pointer-events:auto;-webkit-tap-highlight-color:transparent}
.clear .face{position:relative;height:52px;min-width:52px;border-radius:26px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.16);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;overflow:hidden;transition:background-color .15s ease,border-radius .22s cubic-bezier(.23,1,.32,1),min-width .22s cubic-bezier(.23,1,.32,1),padding .22s cubic-bezier(.23,1,.32,1),transform .16s cubic-bezier(.23,1,.32,1)}
.clear .face svg{flex:none}
.clear .lbl{max-width:0;margin-left:0;opacity:0;white-space:nowrap;transition:max-width .22s cubic-bezier(.23,1,.32,1),margin-left .22s cubic-bezier(.23,1,.32,1),opacity .15s ease}
.clear.armed .face{background:rgba(255,59,48,.94);border-color:rgba(255,255,255,.10);border-radius:14px;min-width:240px;padding:0 22px}
.clear.armed .lbl{max-width:200px;margin-left:10px;opacity:1}
.clear:active .face{transform:scale(.94)}
.glow{position:absolute;width:160px;height:160px;margin:-80px 0 0 -80px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.26),rgba(255,255,255,0));pointer-events:none;opacity:0;transition:opacity .22s ease}
.glow.on{opacity:1;transition:none}
.empty{position:absolute;left:0;right:0;text-align:center;font-size:20px;font-weight:600;color:rgba(255,255,255,.78);opacity:0;transition:opacity .2s ease}
.toast{position:absolute;left:50%;top:34px;transform:translate(-50%,-8px) scale(.96);opacity:0;background:rgba(28,31,38,.96);color:#fff;border-radius:14px;padding:12px 22px;font-size:17px;font-weight:500;white-space:nowrap;transition:opacity .18s cubic-bezier(.33,1,.68,1),transform .18s cubic-bezier(.33,1,.68,1);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset}
.toast.on{opacity:1;transform:translate(-50%,0) scale(1)}
.edgebar{position:absolute;left:50%;bottom:9px;width:150px;height:5px;margin-left:-75px;border-radius:3px;background:rgba(255,255,255,.55);box-shadow:0 0 0 1px rgba(0,0,0,.12);transition:opacity .18s ease,background-color .15s ease}
.edgebar.ink{background:rgba(0,0,0,.5);box-shadow:0 0 0 1px rgba(255,255,255,.2)}   /* on a light app: 3.9 : 1 against #fbfbfc */
.finger{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,255,255,.28);border:2px solid rgba(255,255,255,.75);pointer-events:none;opacity:0;transition:opacity .12s ease}
.finger.on{opacity:1}
/* 「减弱动效」: the springs jump (Spring.step); these go too, like the keyboard mock-up. The countdown bar stays, it is information */
.rm .card .armed,.rm .toast,.rm .clear .face,.rm .clear .lbl,.rm .glow,.rm .empty,.rm .edgebar{transition:none!important}
.rm .card .armed{transform:translateX(-50%)!important}
.rm .toast{transform:translate(-50%,0)!important}
.rm .clear:active .face{transform:none}

/* app mock-ups (drawn at full screen size, shrunk into the cards) */
.a{width:var(--W);height:var(--H);overflow:hidden;font-family:var(--font);line-height:1.5}
.a .bar{height:52px;display:flex;align-items:center;gap:10px;padding:0 18px;font-size:16px}
.a-kate{background:#fbfbfc;color:#23262b}
.a-kate .bar{background:#eef0f3;border-bottom:1px solid #dfe2e6}
.a-kate .tab{padding:7px 14px;border-radius:8px;color:#5d636c}
.a-kate .tab.on{background:#fff;color:#1d2025;box-shadow:0 1px 0 #d6d9de}
.a-kate .code{display:flex;font-family:var(--mono);font-size:21px;line-height:34px;padding-top:12px}
.a-kate .ln{width:64px;text-align:right;padding-right:18px;color:#a6acb5;flex:none}
.a-kate .tx{white-space:pre;color:#2a2e35}
.k-kw{color:#a626a4}.k-ty{color:#1d6fc4}.k-nu{color:#b5631d}.k-st{color:#2f8a3e}.k-cm{color:#9aa0a8}
.a-konsole{background:#17181b;color:#d8dbe0;font-family:var(--mono);font-size:22px;line-height:36px}
.a-konsole .bar{background:#202227;border-bottom:1px solid #2b2e34;font-family:var(--font);color:#aeb3bb}
.a-konsole .term{padding:16px 22px;white-space:pre}
.a-konsole .p{color:#5ac06f}.a-konsole .ok{color:#62a8ff}
.a-web{background:#ffffff;color:#1c1f24}
.a-web .bar{background:#f1f3f5;border-bottom:1px solid #e1e4e8}
.a-web .url{flex:1;max-width:760px;margin:0 auto;height:34px;border-radius:17px;background:#fff;border:1px solid #dde1e6;display:flex;align-items:center;padding:0 16px;color:#5f6670;font-size:16px}
.a-web .hero{margin:56px 8% 0;display:flex;flex-direction:column;gap:18px}
.a-web .hero h2{margin:0;font-size:56px;font-weight:700;letter-spacing:-.01em}
.a-web .hero p{margin:0;font-size:22px;color:#5b616b;max-width:820px}
.a-web .grid{margin:40px 8% 0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.a-web .grid div{height:220px;border-radius:14px;background:#eef1f5}
.a-web .grid div:nth-child(2){background:#e6efff}.a-web .grid div:nth-child(3){background:#eaf6ef}
.a-wili{background:#141518;color:#e9eaee}
.a-wili .bar{background:#1b1c20;gap:28px;font-size:18px;color:#9ea3ab}
.a-wili .bar b{color:#fff;font-weight:600;position:relative}
.a-wili .bar b::after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:3px;border-radius:2px;background:#f25d8e}
.a-wili .tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px;padding:24px}
.a-wili .t i{display:block;aspect-ratio:16/10;border-radius:12px}
.a-wili .t b{display:block;height:16px;border-radius:4px;background:#2b2d33;margin-top:12px;width:92%}
.a-wili .t s{display:block;height:14px;border-radius:4px;background:#24262b;margin-top:8px;width:56%;text-decoration:none}
.a-game{background:#0d1024;color:#fff;position:relative}
.a-game svg{position:absolute;inset:0;width:100%;height:100%}
.a-game .hud{position:absolute;left:28px;top:22px;display:flex;gap:10px}
.a-game .hud i{width:26px;height:26px;border-radius:50%;background:#e9eef7;opacity:.92}
.a-game .hud i.e{background:transparent;box-shadow:0 0 0 2px rgba(233,238,247,.6) inset}
.a-chat{background:#f6f6f4;color:#22252a;display:flex}
.a-chat .side{width:300px;flex:none;background:#efefec;border-right:1px solid #e2e2de;padding:22px 16px;display:flex;flex-direction:column;gap:12px}
.a-chat .side b{display:block;height:18px;border-radius:5px;background:#dcdcd7}
.a-chat .side b.on{background:#d2d2cc}
.a-chat .main{flex:1;display:flex;flex-direction:column;padding:36px 8% 28px;gap:22px;min-width:0}
.a-chat .u{align-self:flex-end;background:#e7e6e1;border-radius:18px;padding:14px 20px;font-size:20px;max-width:70%}
.a-chat .m{display:flex;flex-direction:column;gap:12px;font-size:20px}
.a-chat .m b{display:block;height:16px;border-radius:5px;background:#dedcd6}
.a-chat .in{margin-top:auto;height:76px;border-radius:20px;background:#fff;border:1px solid #e0dfda}
.a-set{background:#f5f6f8;color:#1e2126;display:flex}
.a-set .side{width:320px;flex:none;background:#eceef2;padding:20px 14px;display:flex;flex-direction:column;gap:6px;font-size:19px}
.a-set .side span{padding:10px 14px;border-radius:10px;color:#3e434b}
.a-set .side span.on{background:#dfe6f7;color:#1f4fc1;font-weight:600}
.a-set .main{flex:1;padding:30px 5%;display:flex;flex-direction:column;gap:18px;min-width:0}
.a-set h3{margin:0 0 4px;font-size:28px}
.a-set .row{background:#fff;border-radius:14px;height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:19px;border:1px solid #e6e8ec}
.a-set .sw{width:52px;height:30px;border-radius:15px;background:#2e6bf6;position:relative}
.a-set .sw::after{content:"";position:absolute;right:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff}
.a-set .sw.off{background:#c9cdd4}.a-set .sw.off::after{right:auto;left:3px}
.a-files{background:#fafafb;color:#1f2227;display:flex}
.a-files .side{width:280px;flex:none;background:#f0f1f4;padding:20px 14px;display:flex;flex-direction:column;gap:6px;font-size:18px}
.a-files .side span{padding:9px 14px;border-radius:10px;color:#40454d}
.a-files .side span.on{background:#e2e7f3;font-weight:600}
.a-files .grid{flex:1;padding:30px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:26px 18px;align-content:start;min-width:0}
.a-files .f{display:flex;flex-direction:column;align-items:center;gap:10px;font-size:17px}
.a-files .f i{width:96px;height:76px;border-radius:12px;background:#f2b443;position:relative}
.a-files .f i::before{content:"";position:absolute;left:0;top:-8px;width:40px;height:16px;border-radius:6px 6px 0 0;background:#e9a52f}

/* spec */
.spec{margin-top:44px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,560px),1fr));gap:18px}
.spec section{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px;min-width:0}
.spec h2{font-size:18px;margin:0 0 10px}
.spec h3{font-size:15px;margin:16px 0 6px}
.spec p,.spec li{color:var(--ink-2)}
.spec ul{margin:6px 0 0;padding-left:20px}
.spec li{margin:3px 0}
.spec b{color:var(--ink);font-weight:600}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--ink-3);font-size:13px}
td{color:var(--ink)}
td.wrap{white-space:normal;min-width:180px;color:var(--ink-2)}
.sw-c{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px;box-shadow:0 0 0 1px rgba(0,0,0,.12) inset}
@media (prefers-reduced-motion:reduce){ .seg button,.btn{transition:none} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Y700 多任务卡片 · 设计稿</h1>
    <p>照 vivo OriginOS 手机「堆叠」后台的参数和观感改到平板上（vivo 平板没有堆叠，只有平铺），配色和控件跟控制中心、键盘同一套。下面的平板可以直接用鼠标或手指操作。</p>
  </header>

  <div class="controls" role="toolbar" aria-label="设计稿控制">
    <div class="group"><span class="lbl">开始于</span>
      <div class="seg" id="segStart">
        <button type="button" data-v="app" aria-pressed="true">应用（Kate）里</button>
        <button type="button" data-v="desk" aria-pressed="false">桌面</button>
      </div>
    </div>
    <div class="group"><span class="lbl">方向</span>
      <div class="seg" id="segOrient">
        <button type="button" data-v="land" aria-pressed="true">横屏</button>
        <button type="button" data-v="port" aria-pressed="false">竖屏</button>
      </div>
    </div>
    <div class="group"><span class="lbl">速度</span>
      <div class="seg" id="segSpeed">
        <button type="button" data-v="1" aria-pressed="true">1×</button>
        <button type="button" data-v="0.5" aria-pressed="false">½×</button>
        <button type="button" data-v="0.2" aria-pressed="false">⅕×</button>
      </div>
    </div>
    <button type="button" class="btn" id="demoBtn">演示：上滑停住</button>
    <button type="button" class="btn ghost" id="resetBtn">重置</button>
    <label class="toggle"><input type="checkbox" id="fingerChk" checked> 显示触点</label>
    <label class="toggle"><input type="checkbox" id="reduceChk"> 减弱动效</label>
  </div>

  <div class="stage">
    <div class="device"><div class="viewport" id="viewport"><div class="screen" id="screen" tabindex="0" aria-label="平板屏幕，可拖动"></div></div></div>
    <p class="hint">从屏幕底边那条白线往上拖：<b>停住</b>出卡片，<b>快划</b>回桌面，<b>沿底边横拖</b>直接切到上一个应用。出卡片后：横拖翻卡片，卡片上划关掉，点卡片打开，点空白处回到原来的应用（从桌面进来的就回桌面），键盘 Esc 也一样。</p>
    <p class="note" id="rmNote"></p>
  </div>

  <div class="spec" id="spec"></div>
</div>

<script>
"use strict";
/* ---------------- geometry: vivo OriginOS's phone-stack parameters, mapped to 1600x1002 / 1002x1600 ---------------- */
const SCREENS = { land: { W: 1600, H: 1002, ratio: 0.6, lift: 26 }, port: { W: 1002, H: 1600, ratio: 0.683, lift: 40 } };
const EXPOSED = 0.7845, EDGE0 = -10, RADIUS = 18, HEAD = 44;
function geometry(o) {
  const s = SCREENS[o], cw = s.W * s.ratio, ch = s.H * s.ratio, E = EXPOSED * cw;
  const X = d => EDGE0 + (E / 27) * (Math.pow(3, 3 - d) - 1) / 2;
  const xs = [[-2, X(-1) + 1.5 * E], [-1, X(-1)], [0, X(0)], [1, X(1)], [2, X(2)], [3, X(3)], [4, EDGE0]];
  const top = Math.round((s.H - ch) / 2 - s.lift);
  // vivo rests the two END cards centred: 3 * int(x0 - centred x) px of scroll, i.e. delta of a card behind slot 0
  const delta = 3 * Math.trunc(X(0) - (s.W - cw) / 2) / E;
  return { ...s, o, cw, ch, E, X0: X(0), xs, top, delta, k: 1 / s.ratio, clearY: Math.round(s.H * .904) };
}
const T = {   // per depth slot d (0 = front, 1.. behind on the left, -1 newer card on top at the right)
  scale:  [[-2, 1.032], [-1, 1.016], [0, 1], [1, .984], [2, .968], [3, .953], [4, .953]],

function lin(t, d) {

function restS(i) {            // scroll value at rest with card i in front: the two end cards rest centred, like vivo

  if (i >= n - 1) return n - 1 - d;

}
function idxAt(v) {            // the card whose resting scroll is nearest (the two end rests sit off the integers)

  return k;

function propS(v) {            // like vivo: the looks hold still over the end segment, so a centred end card keeps the front look
  const n = cards.length, d = G.delta;

  if (v <= 0) return 0;
  if (v >= n - 2 && v <= n - 1 - d) return n - 2 + (v - (n - 2)) / (1 - d);

/* ---------------- transitions ---------------- */
function rerank() { cards.forEach((c, i) => c.slot.to(i)); }

function enterRecentsFromApp(vz = 0, vs = 0) {     // the app shrank into its card; settle into the stack
  mode = 'recents';
  z.to(0, ...K.zoom, vz);
  s.to(restS(idxAt(s.v)), ...K.scroll, vs);
  b.to(1, ...K.blur); e.to(1, ...K.enter);
}
function openRecentsFromDesk(ve = 0) {
  mode = 'recents'; originCard = null;
  e.to(1, ...K.enter, ve); s.to(restS(idxAt(s.v)), ...K.scroll); b.to(1, ...K.blur); z.to(0, ...K.zoom);   // caught on its way out: keep the card it was on
}
function disarmAll() {                 // a confirmation never outlives the card screen it was given on
  clearTimeout(clearTimer); clearArmed = 0; els.clear.classList.remove('armed');
  for (const c of cards.concat(flying)) { clearTimeout(c.armTimer); c.armed = 0; c.armedEl.classList.remove('on'); }
}
function openCard(c, vs) {             // tap, quick switch, or "close the cards = back to where I was"
  disarmAll();
  if (!c) return leaveToDesk();
  mode = 'opening'; openTarget = c;
  s.to(restS(cards.indexOf(c)), ...K.scroll, vs); z.to(1, ...K.zoom); e.to(1, ...K.enter);
}
function dismiss() {                   // leave without choosing
  if (mode !== 'recents') return;
  if (originCard && cards.includes(originCard)) openCard(originCard);
  else leaveToDesk();
}
function leaveToDesk() {

}
function goHomeFromApp() {             // fast flick up from an app
  disarmAll(); mode = 'homing';
  h.to(1, ...K.home); b.to(0, ...K.home);
}
function settle() {                    // called each frame after the springs: finish transitions
  if (mode === 'opening' && openTarget && z.rest && Math.abs(s.v - s.t) < .004) {
    const c = openTarget, ci = cards.indexOf(c);
    if (ci < 0) { openTarget = null; leaveToDesk(); return; }      // closed on the way (defensive)
    cards.splice(ci, 1); cards.unshift(c); c.zk = ++zTop;         // KWin re-sorts by last activation
    cards.forEach((x, i) => x.slot.jump(i));
    focusCard = c; originCard = null; openTarget = null; mode = 'app'; b.jump(0);
    s.jump(restS(0)); pj.jump(0); anc.jump(anchorX());            // same picture: the app fills the screen either way
  } else if (mode === 'leaving' && e.rest && b.rest) {
    mode = 'desk'; focusCard = null; originCard = null; z.jump(0); s.jump(restS(0)); pj.jump(0);
  } else if (mode === 'homing' && h.rest) {
    mode = 'desk'; focusCard = null; originCard = null; h.jump(0); z.jump(0); e.jump(0); s.jump(restS(0)); pj.jump(0);
  }
}

/* ---------------- closing cards ---------------- */
function closeCard(c, v = -2600) {
  const i = cards.indexOf(c);

      return `<tr><td>${d === -1 ? '−1（更新的）' : d === 0 ? '0（前排）' : d}</td><td>${Math.round(X(d))}</td><td>${peek}</td><td>${lin(T.scale, d)}</td><td>${lin(T.dim, d)}</td><td>${lin(T.alpha, d)}</td><td>${lin(T.head, d)}</td></tr>`;
    }).join('');
  };
  const gl = geometry('land'), gp = geometry('port');
  document.getElementById('spec').innerHTML = `
  <section><h2>叠放几何</h2>
    <p>卡片 = 屏幕 × ${gl.ratio}（横屏）/ ${gp.ratio}（竖屏），比例和屏幕一样，所以能无缝放大成全屏。前排卡片露出 0.7845 × 卡宽，往后每张只露前一张的三分之一。旧卡片叠在左边、压在下面，新卡片在右边、压在上面。</p>
    <p><b>两端的卡片停在正中</b>（vivo 原样）：停在最新那张时它居中（横屏左边 x = ${Math.round(xAt(gl, gl.delta))}），后面几张露出 ${[1, 2, 3].map(i => Math.round(xAt(gl, i - 1 + gl.delta) - Math.max(0, xAt(gl, i + gl.delta)))).join(' / ')} px；停在最旧那张时它也居中，左边没有卡片，那张更新的卡片压在它右边（横屏 x ≈ ${Math.round(xAt(gl, -1 + gl.delta))}）。停在中间的卡片才用下表的位置。所以从应用上滑时，应用是朝屏幕正中缩成卡片的。</p>
    <h3>横屏 1600 × 1002：卡片 ${Math.round(gl.cw)} × ${Math.round(gl.ch)}，顶边 y = ${gl.top}，前排露出 ${Math.round(gl.E)} px</h3>
    <div class="tbl"><table><thead><tr><th>槽位</th><th>左边 x</th><th>露出</th><th>缩放</th><th>压暗</th><th>透明度</th><th>标题</th></tr></thead><tbody>${rows('land')}</tbody></table></div>
    <h3>竖屏 1002 × 1600：卡片 ${Math.round(gp.cw)} × ${Math.round(gp.ch)}，顶边 y = ${gp.top}，前排露出 ${Math.round(gp.E)} px</h3>
    <div class="tbl"><table><thead><tr><th>槽位</th><th>左边 x</th><th>露出</th><th>缩放</th><th>压暗</th><th>透明度</th><th>标题</th></tr></thead><tbody>${rows('port')}</tbody></table></div>
    <p>所有属性都由一个滚动值驱动，在相邻槽位之间线性插值（vivo 就是这么做的）。手指拖动时，压在最上面的那张卡片和手指 1:1 同步，后面的卡片按 1/3、1/9 的比例慢慢跟上。「标题」一列是图标的透明度；应用名只有前排那张显示，换卡片时前一张的名字走到七成才淡出，下一张的名字跟着位置淡入；停在最旧那张时，压在它右边的那张也显示名字（vivo 原样）。从两端离开时，头一小段（横屏 ${gl.delta.toFixed(2)} 张、竖屏 ${gp.delta.toFixed(2)} 张）只移动位置、外观不变，所以居中的端卡始终是前排的样子。松手吸附到最近的停靠位。</p>
  </section>
  <section><h2>动效</h2>
    <p>全部改成弹簧，松手时接上手指的速度；任何动画进行到一半都能用手指接住（OriginOS 7 的「首帧可打断」）。</p>
    <div class="tbl"><table><thead><tr><th>场景</th><th>参数</th><th>说明</th></tr></thead><tbody>
      <tr><td>横滑翻卡片、松手吸附</td><td>刚度 200，阻尼比 1.2</td><td class="wrap">不回弹，约 0.35 s 到 90%。张力 200、摩擦 34，是参照系统里卡片吸附用的那组参数；松手时按速度往前投射，松手速度超过 60 px/s 就至少翻一张（vivo 叠放的门槛），一次最多翻 4 张</td></tr>
      <tr><td>上滑：应用缩成卡片</td><td>跟手；松手后 214 / 1.0</td><td class="wrap">停住就进卡片；快划回桌面；沿底边横划直接切应用</td></tr>
      <tr><td>从桌面呼出</td><td>214 / 1.0；背景 1200 / 1.0</td><td class="wrap">卡片从左侧深处滑到前排，背景约 0.1 s 内模糊</td></tr>
      <tr><td>卡片上划关掉</td><td>飞出 200 / 0.9；弹回 500 / 0.89</td><td class="wrap">划过一半（到卡片底边的一半，横屏约 ${Math.round(.5 * (gl.top + gl.ch * (1 + lin(T.scale, -1)) / 2 + 3))} px）或快划就关，和 vivo 一样；只位移、不淡出；否则弹回</td></tr>
      <tr><td>关掉后补位</td><td>260 / 0.83</td><td class="wrap">后面的卡片往前补，带一点回弹</td></tr>
      <tr><td>点卡片打开、关卡片回原应用</td><td>放大 214 / 1.0；同时滚到那张</td><td class="wrap">卡片放大成全屏，圆角同步收成 0</td></tr>
      <tr><td>回桌面</td><td>500 / 1.0</td><td class="wrap">卡片沉回左侧深处并淡出，比进来快</td></tr>
      <tr><td>全部关闭</td><td>同时发射，900 / 1.0，初速 5200 px/s</td><td class="wrap">所有卡片一起往上飞，约 0.15 s；留下的游戏卡片原地滑到正中，没有留下的就回桌面</td></tr>
      <tr><td>按下卡片</td><td>缩到 97%</td><td class="wrap">约 0.1 s，跟控制中心磁贴一致</td></tr>
    </tbody></table></div>
    <p><b>减弱动效</b>：弹簧直接到位；按钮变形、提示条位移、按下缩放也都去掉，只留「再上划一次」的倒计时条（它是信息，不是装饰）。和键盘稿同一条规矩。</p>
  </section>
  <section><h2>交互规则</h2>
    <ul>
      <li><b>点空白处 / Esc / 再按一次快捷键（G9 双击主页键）</b>：回到打开卡片之前的那个应用；从桌面打开的就回桌面；原来的应用在卡片里被关掉了也回桌面。（vivo 这里是一律回桌面，这条按作者的要求改了。）</li>
      <li><b>点卡片</b>：打开它。<b>卡片上划</b>：关掉它。<b>卡片下拉</b>：有阻尼，松手弹回（vivo 是锁定，我们不做）。</li>
      <li><b>游戏防误关</b>：第一次上划只弹回并亮红条「再上划一次才会关掉」，3 秒内再划才关。「全部关闭」也不关游戏。</li>
      <li><b>全部关闭</b>：底部圆钮，点一下变成红色「再点一次全部关闭」，3 秒内再点才执行。</li>
      <li><b>卡片打开时从底边上滑</b>：回桌面。</li>
      <li><b>接住不算点</b>：卡片还在滑、或者正在沉回桌面时点一下，只是接住停下，不会打开卡片也不会返回。系统收走触摸时（比如别的边缘手势抢了），当前手势撤回，什么都不提交。</li>
      <li><b>只认一根手指</b>：第二根手指按下不起作用，拖着卡片时也点不了「全部关闭」。离开卡片界面，「再点一次」和「再上划一次」的确认状态一起作废。</li>
      <li>键盘或控制中心开着时，底边手势照旧暂停（现有规矩不变）。</li>
    </ul>
  </section>
  <section><h2>视觉</h2>
    <ul>
      <li><b>背景</b>：壁纸和桌面图标一起模糊（图标不缩放），再压一层 30% 的 <span class="sw-c" style="background:#16181e"></span>#16181E。vivo 是 20% 黑；加到 30% 是为了亮壁纸上白字标题也看得清（中间调壁纸上对比度约 4.8 : 1）。平板上由 KWin 做一张模糊快照，不实时重算。</li>
      <li><b>卡片</b>：圆角 ${RADIUS}（家族规范最大 20，vivo 默认 20）；1 px 白色 8% 描边；左侧投影把叠在一起的卡片分开。</li>
      <li><b>标题</b>：卡片上方，离左边 9 px；图标 30、圆角 8；应用名 16 号 600 字重，只给前排那张。往后第二张的图标淡到 60%，第三张起只剩卡片。</li>
      <li><b>全部关闭</b>：52 px 毛玻璃圆钮（白 16%，描边白 16%），触控区 64 px，放在屏幕高度 90% 处（vivo 手机约 91%）；按下 94% 缩放和点触光斑。点一下原地变成红色确认块：家族的红 <span class="sw-c" style="background:#ff3b30"></span>#FF3B30、圆角 14。</li>
      <li><b>底边白线</b>：桌面和深色应用上是白 55%；浅色应用上换成 50% 黑（对 #FBFBFC 约 3.9 : 1），不然看不见。</li>
      <li><b>提示条</b>：深色 <span class="sw-c" style="background:#1c1f26"></span>rgba(28,31,38,.96)，圆角 14，17 号字。</li>
      <li><b>字</b>：Noto Sans CJK SC，最小 16 号（标签 13 号除外）。</li>
    </ul>
  </section>
  <section><h2>有意不做</h2>
    <ul>
      <li><b>锁定卡片</b>（vivo 下拉锁定、清理时保留）：KDE 没有对应概念，游戏防误关已经覆盖了最常见的误关。</li>
      <li><b>名字后面的 ▾ 菜单</b>（小窗、分屏）：KWin 这边没有现成的对应操作。</li>
      <li><b>平铺 / 宫格切换、隐私模糊、清理后提示释放了多少内存</b>：这次只做叠放。</li>
      <li><b>卡片上的 × 按钮</b>（现在的平铺版有）：vivo 叠放没有；叠起来以后右边那张新卡片会压住前排标题的右半边。关卡片就上划，或者用「全部关闭」。</li>
      <li><b>按下卡片放大到 1.03</b>（vivo 叠放的按压反馈）：家族规矩是按下缩小（97%），和控制中心、键盘一致。</li>
      <li><b>vivo 的桌面缩到 0.9</b>：KWin 的 DesktopBackground 里壁纸和图标是一体的，单独缩图标做不到，整张缩又会露出边缘。</li>
    </ul>
  </section>`;
}

renderSpec();
