# Boot-time routing + gadget recovery with the local script (see y700-usb-port)
[Service]
ExecStart=
ExecStart=/usr/local/libexec/y700-usb-port boot
# A monitor attached at boot: its DP hotplug event was sent before the root udev rules existed, so
# 71-y700-dp-source.rules never saw it (README「USB-C 外接屏」). Check once here; "-": a failure
# does not fail the service.
ExecStartPost=-/usr/local/libexec/y700-dp-source
