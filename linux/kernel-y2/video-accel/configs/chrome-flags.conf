# Verified against Chrome 155's own binary, not copied from guides:
#   strings -a /opt/google/chrome/chrome | grep -oE '(Accelerated|Vaapi)[A-Za-z]*(Video|Encode|Decode)[A-Za-z]*' | sort -u
--enable-features=AcceleratedVideoDecodeLinuxGL,AcceleratedVideoDecoder,AcceleratedVideoEncoder,VaapiVideoDecoder,VaapiVideoEncodeAccelerator,VaapiIgnoreDriverChecks
--ignore-gpu-blocklist
--enable-gpu-rasterization
--enable-zero-copy
--ozone-platform-hint=auto
