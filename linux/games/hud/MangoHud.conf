### y700: MangoHud is used only as the FPS source for y700-hud-overlay (the desktop switch "游戏性能浮层").
# It draws an invisible HUD (fps_only with alpha 0: with no_display the logger never starts) and streams
# fps/frametime once a second to a CSV that the overlay's sampler (overlay/src/sampler.rs) tails. Both options are read at game start:
# a running game has to be restarted after changes here.
# MangoHud cannot read this SoC's GPU load/temperature or tsens, and its own text rows cannot be sized,
# which is why the overlay is a separate window.
fps_only
alpha=0
background_alpha=0
font_size=4
position=bottom-right
log_interval=1000
# must be under $HOME: pressure-vessel gives Steam games a private /run/user/<uid> and /tmp
output_folder=/home/user/.cache/y700-hud
autostart_log=1
log_duration=0
permit_upload=0
