# /etc/systemd/system/livi-wifi-ap.service.d/y700.conf (linux/carplay/livi/, 2026-10-17)
# LIVI owns livi-wifi-ap.service and rewrites it when its text differs; it never looks at drop-ins.
[Unit]
Wants=y700-carplay-ap-tune.service

[Service]
# Runs after LIVI's own ExecStartPre (--wifi-ap-claim): wait for wpa_supplicant to let go of the interface,
# so its late deinit cannot stop the AP hostapd has just started, then reload ath12k (fresh firmware: after a
# 6 GHz station spell the old one may drop every EAPOL frame of the AP). See /usr/local/sbin/y700-carplay-ap-settle.
ExecStartPre=/usr/local/sbin/y700-carplay-ap-settle
# livi-helperd --wifi-ap turns the station's power save off and its teardown leaves it off (10-22); turn it back
# on once wlp1s0 is a station again. "-": never fails the unit. See /usr/local/sbin/y700-carplay-ps-restore; when
# wlp1s0 is not a station within its 10 s, NetworkManager's dispatcher hook 90-y700-carplay-ps finishes the job
# the next time wlp1s0 comes up (10-24).
ExecStopPost=-/usr/local/sbin/y700-carplay-ps-restore
# LIVI's unit has TimeoutStopSec=8, which systemd also gives ExecStopPost: at 15:01 on 10-23 the script was killed
# there ("State 'stop-post' timed out"), silently, and power save stayed off. It waits up to 10 s and ends within
# ~19 s at worst; 40 s leaves room. Also bounds ExecStop (LIVI's --wifi-ap-teardown), which takes well under 1 s.
TimeoutStopSec=40
