# y700: ath12k from our own build when one exists for the running kernel
# (/usr/local/lib/modules/y700/<uname -r>/), else the kernel's own module.
#   - stock 7.3.0-rc4-tb323fu-t47: rebuilt with clang 18.1.3 (clang 21 drops BTI landing pads ->
#     Oops-BTI panic) plus the wcn7860_mlo param, default off (/usr/local/lib/modules/y700/ath12k.ko)
#   - y7 (2026-10-15): + 1041 station power save actually enabled (vif_cfg_changed handles
#     BSS_CHANGED_PS; the firmware was in CAM forever: Wi-Fi idle cost 0.19 W with the screen off).
#     Source: /usr/local/src/linux-t47 + /root/make-1041.py; linux/kernel-y8/1041-*.patch in the repo.
# /lib/modules/<release> is a read-only image, hence the insmod detour. Back out: delete the
# per-release directory (or this file) and reboot. The wifi7 module must come from the same build.
install ath12k if [ -e /usr/local/lib/modules/y700/$(uname -r)/ath12k.ko ]; then /sbin/insmod /usr/local/lib/modules/y700/$(uname -r)/ath12k.ko $CMDLINE_OPTS; elif [ "$(uname -r)" = 7.3.0-rc4-tb323fu-t47 ]; then /sbin/insmod /usr/local/lib/modules/y700/ath12k.ko $CMDLINE_OPTS; else /sbin/modprobe --ignore-install ath12k $CMDLINE_OPTS; fi
install ath12k_wifi7 /sbin/modprobe ath12k && if [ -e /usr/local/lib/modules/y700/$(uname -r)/wifi7/ath12k_wifi7.ko ]; then /sbin/insmod /usr/local/lib/modules/y700/$(uname -r)/wifi7/ath12k_wifi7.ko $CMDLINE_OPTS; elif [ "$(uname -r)" = 7.3.0-rc4-tb323fu-t47 ]; then /sbin/insmod /usr/local/lib/modules/y700/ath12k_wifi7.ko $CMDLINE_OPTS; else /sbin/modprobe --ignore-install ath12k_wifi7 $CMDLINE_OPTS; fi
