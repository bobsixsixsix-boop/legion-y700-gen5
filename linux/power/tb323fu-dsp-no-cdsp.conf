# /etc/systemd/system/tb323fu-dsp.service.d/no-cdsp.conf -- start the audio DSP only, leave the compute DSP off.
# (y700, 2026-10-16, linux/power/ALWAYS-ON.md section 1. NOT installed yet: the owner decides.)
#
# The upstream unit writes "start" to both remoteprocs after the root filesystem is mounted (the kernel's own
# auto-boot in the initramfs finds no firmware). Nothing on this Linux uses the CDSP: fastrpc has 0 users,
# hexagonrpcd (sensors) is pointed at /dev/fastrpc-adsp-secure, audio is the ADSP (q6apm), the helper leaves the
# NPU alone. The booted CDSP sleeps 100 % of the time (qcom_stats: in its low-power state since 13 s after boot),
# so the power saving is unmeasurable; what goes away is 4.9 MB of firmware load (~1.2 s of boot), three fastrpc
# device nodes, one QRTR/glink edge and one more subsystem to reason about in the CX-collapse experiments.
# Never-started is preferred over "echo stop" at run time: stopping a running remoteproc has never been tried
# on this device (upstream warns about the ADSP).
# To use the CDSP anyway (NPU experiments): echo start > /sys/class/remoteproc/remoteproc2/state
# Undo: rm this file; systemctl daemon-reload (next boot starts both again).
[Service]
ExecStart=
ExecStart=/bin/sh -c 'fw=/lib/firmware/qcom/kaanapali/lenovo/baldur; rc=0; for want in adsp; do [ -f $fw/$want.mbn ] || { echo "$want: no firmware, skipped"; continue; }; f=; for r in /sys/class/remoteproc/remoteproc*; do [ "$(cat $r/name)" = $want ] || continue; f=1; [ "$(cat $r/state)" = running ] && break; echo start > $r/state || rc=1; done; [ -n "$f" ] || echo "no $want remoteproc"; done; echo "cdsp left off (y700 no-cdsp drop-in)"; exit $rc'
