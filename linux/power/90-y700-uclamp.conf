# /etc/sysctl.d/90-y700-uclamp.conf -- only with kernel y8+ (CONFIG_UCLAMP_TASK); on y7 the key does not exist.
# Without this, any runnable RT task (every threaded IRQ handler: touch, haptics, iris; PipeWire's data
# thread) asks schedutil for the CPU's top frequency (3.6 / 4.4 GHz). Android sets it to 0 and boosts
# its audio/camera threads through cgroup uclamp instead. Here PipeWire runs the speaker-protection DSP
# chain, so start at 128 (the SDM845 value from the patch author); try 64 / 0 only after pw-top shows no
# xruns and touch feels the same. Back out at runtime: sysctl -w kernel.sched_util_clamp_min_rt_default=1024
kernel.sched_util_clamp_min_rt_default = 128
