# /etc/tmpfiles.d/y700-cpuidle.conf -- TEO idle governor (built into y8+; menu stays the default by rating).
# Screen-off A/B 2026-10-15 22:30: 0.43 -> 0.40 W, within the +/-0.03 W noise; Android (Pixel init.rc) picks
# teo the same way. Zero risk: echo menu > current_governor puts it back.
w /sys/devices/system/cpu/cpuidle/current_governor - - - - teo
