# /etc/systemd/system/tb323fu-emergency-key.service.d/y700-keyhold-local.conf
#
# y700 interim override (linux/power/KEYHOLD.md section 5, variant C): run the
# event-driven keyhold built from linux/power/keyhold.c instead of the packaged
# /usr/libexec/tb323fu/keyhold (tb323fu-platform 0.4.2 wakes 5 times a second).
# Only this service sees the bind mount; no package file is touched, dpkg
# --verify stays clean and upgrades do not conflict. An upgrade of
# tb323fu-platform renames the new file over the old one, which detaches this
# bind inside the running service (the packaged keyhold is used from the next
# start of keyhold on): restart tb323fu-emergency-key after every upgrade.
# The leading "-" ignores a missing source: if /usr/local/libexec/tb323fu/keyhold
# is gone the service falls back to the packaged binary instead of failing to
# start (the emergency chord must never depend on this override).
# Remove this file (daemon-reload + restart) once tb323fu-platform ships an
# event-driven keyhold.
[Service]
BindReadOnlyPaths=-/usr/local/libexec/tb323fu/keyhold:/usr/libexec/tb323fu/keyhold
