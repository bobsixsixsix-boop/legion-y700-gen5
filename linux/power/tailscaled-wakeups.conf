# /etc/systemd/system/tailscaled.service.d/y700-wakeups.conf -- fewer periodic wakeups from tailscaled 1.104.1.
# See linux/power/WAKEUPS.md 2.4 for what tailscaled does at idle and what cannot be switched off.
#
# TS_PORTLIST=false: the "portlist" feature (feature/portlist/portlist.go) polls the listening sockets every
# 1 s on Linux (portlist/portlist_linux.go init() sets pollInterval = 1 s, "Refresh service discovery once per
# second"; poller.go's 5 s is only the generic default) - netlink inet_diag for all four families, /proc/net/tcp*,
# udp* as fallback, plus /proc/*/fd walks for new sockets - to report "services" to the admin console.
# envknob.BoolDefaultTrue("TS_PORTLIST") = false skips the whole extension, so the ticker never exists.
# (TS_DEBUG_DISABLE_PORTLIST=1 would also end up quiet, but through an error path: the poller records initErr, the
# first Poll() fails and runPollLoop returns - "TODO: this is kinda weird that we just return here" - so the ticker
# is stopped one tick later; with ShieldsUp or "Collect services" off Poll() is never reached and the ticker keeps
# firing. TS_PORTLIST=false never loads the extension at all.)
# Lost: the "Services" column of the machine in the Tailscale admin console. Nothing else.
#
# Optional, off by default: TS_NO_LOGS_NO_SUPPORT=1 - no log upload to log.tailscale.com (logtail flushes
# buffered lines 2 s after they appear). Saves the upload bursts, costs Tailscale support's view of the node.
#
# Not set on purpose:
#  - TS_DEBUG_RESTUN_STOP_ON_IDLE: the periodic STUN (every 20-26 s) already stops after 45 s without TUN
#    traffic on every platform (magicsock shouldDoPeriodicReSTUNLocked, IdleFunc = tundev.IdleDuration); the knob
#    only adds logging.
#  - TS_DEBUG_ENABLE_SILENT_DISCO: experimental; the 3 s disco heartbeat already stops 45 s after the last send.
#  - GOMAXPROCS / GOGC: a smaller GOMAXPROCS (2) reduces cross-CPU goroutine hand-offs (IPI1) - plausible,
#    unmeasured; measure with y700-wakeups before adopting.
# Apply: systemctl daemon-reload && systemctl restart tailscaled   (a few seconds of VPN loss; do it from the LAN
# address, not over the tailnet). Verify: grep -z TS_PORTLIST /proc/$(pidof tailscaled)/environ
[Service]
Environment=TS_PORTLIST=false
#Environment=TS_NO_LOGS_NO_SUPPORT=1
