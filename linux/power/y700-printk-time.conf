# /etc/tmpfiles.d/y700-printk-time.conf -- kernel log lines get their "[seconds.micros]" prefix back (2026-11-01).
# CONFIG_PRINTK_TIME=y, but the upstream initramfs switches it off before switch_root
# (linux/tb323fu-linux/kernel/initramfs/init:193, echo N); tmpfiles runs after that. Why: the 10-31 21:04 oops in
# console-ramoops had no times, so it could not be lined up with the flight recorder's pmsg lines
# (README "10-31 21:04 死机"). Cost: ~15 B per console line. Undo: echo N > /sys/module/printk/parameters/time.
w /sys/module/printk/parameters/time - - - - Y
