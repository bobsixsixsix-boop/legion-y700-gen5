[package]
name = "y700-cx-auto"
version = "0.1.0"
edition = "2021"
description = "y700: the runtime CX-collapse E3a level while the panel is off on battery, self-disabling after a reset"
publish = false

# Built offline on the tablet against Ubuntu's packaged crates (only libc; .cargo/config.toml points crates-io at
# /usr/share/cargo/registry), like linux/games/hud/overlay.
[dependencies]
libc = "0.2"

[[bin]]
name = "y700-cx-auto"
path = "src/main.rs"

[profile.release]
opt-level = 3
strip = true
