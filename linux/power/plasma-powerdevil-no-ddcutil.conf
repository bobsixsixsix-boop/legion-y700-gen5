# ~/.config/systemd/user/plasma-powerdevil.service.d/y700-no-ddcutil.conf -- PowerDevil without libddcutil.
# Why (linux/power/WAKEUPS.md 2.1): PowerDevil 6.6 calls ddca_start_watch_displays() at start
# (daemon/controllers/ddcutildetector.cpp), and libddcutil 2.2.5 then runs a "display_recheck_thread" whose loop
# is g_async_queue_timeout_pop(recheck_queue, 100 ms) - 10 wakeups/s forever, with the queue empty, on a tablet
# whose only panel is DSI and has no DDC/CI at all (src/dw/dw_recheck.c; the udev watch thread adds its 500 ms
# loop). y700-whoawake showed it as the "display_recheck" thread, 10/s with the screen off.
# POWERDEVIL_NO_DDCUTIL=1 is PowerDevil's own switch (ddcutildetector.cpp, documented in its README): no
# ddca_init, no watch threads. Lost: DDC/CI brightness control of an external monitor over USB-C DP. The internal
# panel's brightness goes through KWin/the backlight class and is unaffected.
# Apply: systemctl --user daemon-reload && systemctl --user restart plasma-powerdevil.service
# Verify: grep -z POWERDEVIL_NO_DDCUTIL /proc/$(pidof org_kde_powerdevil)/environ; no display_recheck in
#         /proc/$(pidof org_kde_powerdevil)/task/*/comm.   Undo: remove this file, daemon-reload, restart.
[Service]
Environment=POWERDEVIL_NO_DDCUTIL=1
