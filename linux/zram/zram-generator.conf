# y700 /etc/systemd/zram-generator.conf (2026-10-11; 2026-11-04 zram-size ram, was ram / 2): /dev/zram0 is the only swap,
# as big as RAM ("ram" is MemTotal in MiB), zstd. The owner's choice "2选B" (README「内核 y19」) over installing
# tb323fu-platform 0.4.6, whose tb323fu-zram leaves an existing zram alone. vm.swappiness / vm.page-cluster are in
# /etc/sysctl.d/90-y700-zram.conf. Apply: systemctl daemon-reload && systemctl restart systemd-zram-setup@zram0
# (swapoff first: the pages in swap must fit back into RAM, look at free -m). Checked by y19-verify.sh and y700-checklist.
[zram0]
zram-size = ram
compression-algorithm = zstd
swap-priority = 100
