# y700 /etc/sysctl.d/90-y700-zram.conf (2026-11-04, the owner's choice "2选B"; README「内核 y19」). Swap is /dev/zram0
# only (/etc/systemd/zram-generator.conf): no seek cost, so swap in one page at a time (page-cluster 0, the default 3
# reads 8 pages) and let the kernel trade cold anonymous pages for page cache freely (swappiness 100, the value
# tb323fu-platform 0.4.6's tb323fu-zram sets too; the default 60 was tuned for disks). Applied by systemd-sysctl at boot;
# now: sysctl --system. Removing this file does NOT restore 60 / 3 until a reboot: sysctl -w them. Checked by
# y19-verify.sh and y700-checklist「zram」.
vm.swappiness = 100
vm.page-cluster = 0
