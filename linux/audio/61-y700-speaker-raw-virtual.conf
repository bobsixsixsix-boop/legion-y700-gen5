# y700 (2026-10-16): announce the raw ALSA speaker sink as a virtual device, so desktop UIs hide it.
# Installed to /etc/wireplumber/wireplumber.conf.d/ (next to the platform's own rule for the same node,
# /usr/share/wireplumber/wireplumber.conf.d/60-tb323fu-speaker-raw.conf, which names it
# "Speakers (raw, unprotected)"; WirePlumber applies every matching rule, this one only adds a key).
#
# Why: the Plasma volume applet lists only non-virtual devices (PulseObjectFilterModel.qml,
# filterVirtualDevices, on by default), and pipewire-pulse decides "virtual" from node.virtual alone
# (no node.virtual -> SINK_HARDWARE, pulse-server.c:3775). Both filter chains (Lenovo tuning, the
# platform's protecting "Speakers") are virtual, so the tray showed exactly one device: this raw sink,
# which y700-speaker-guard pins at 100 % -> "the speakers volume is locked at 100 %". Together with
# node.virtual = false on the tuned sink (y700-lenovo-tuning.conf) the tray lists only
# "扬声器（联想调音）".
# Side effects checked in PipeWire 1.6.2 / WirePlumber 0.5.13: node.virtual is read only by
# pipewire-pulse (HARDWARE flag; client attribution of *streams*, not sinks; switch-on-connect and
# zeroconf, both unused here) and by WirePlumber's find-media-role-sink-target.lua for
# Stream/Output/Audio nodes only. KDE's PreferredDevice (volume keys) skips virtual non-default
# devices, so the raw sink can no longer be picked even while it is the only RUNNING one.
# Takes effect when WirePlumber starts (next boot; do not restart WirePlumber by hand, see README).
# Rollback: delete this file (next boot).
monitor.alsa.rules = [
  {
    matches = [ { node.name = "alsa_output.platform-sound.HiFi__Speaker__sink" } ]
    actions = {
      update-props = {
        node.virtual = true
      }
    }
  }
]
