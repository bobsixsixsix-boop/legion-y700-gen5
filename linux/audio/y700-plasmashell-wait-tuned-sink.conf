# /etc/systemd/user/plasma-plasmashell.service.d/y700-wait-tuned-sink.conf (2026-10-16)
# The volume keys bind to the default sink plasmashell sees at start: wait (<= 12 s) for the Lenovo tuning sink.
# Undo: rm this file; systemctl --user daemon-reload (takes effect at the next login).
[Service]
ExecStartPre=-/usr/local/libexec/y700-wait-tuned-sink
