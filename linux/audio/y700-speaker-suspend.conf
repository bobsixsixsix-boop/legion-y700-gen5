# y700: /etc/wireplumber/wireplumber.conf.d/90-y700-speaker-suspend.conf -- NOT INSTALLED (2026-10-16),
# see linux/audio/SUSPEND.md. Loads /usr/local/share/wireplumber/scripts/y700-speaker-suspend.lua, which
# re-sends Suspend to the built-in speaker sink when it is still "idle" (= PCM open and running on silence)
# a few seconds after the stock suspend timeout.
#
# The script is named by its absolute path: WirePlumber looks relative script names up only in the data
# dirs (XDG_DATA_HOME, XDG_DATA_DIRS, /usr/share; module-lua-scripting/module.c:130-142 and
# lib/wp/base-dirs.h:65-70 in 0.5.13), so a relative name under /usr/local/share would depend on the
# session's XDG_DATA_DIRS. An absolute path is used as is (module.c:137-139).
# It provides a hooks.* feature like the stock hooks, so the stock wireplumber.components.rules order it
# before support.standard-event-source (wireplumber.conf:770ff) and add the support.lua-scripting
# requirement every script/lua component gets.
# The script is pulled in by a virtual component that only WANTS it, so a missing or broken script costs a
# warning in `journalctl --user -u wireplumber`, not the session: a REQUIRED script that fails to load
# makes the whole profile fail, and then WirePlumber manages no audio at all.
# Takes effect when WirePlumber starts (next boot); see SUSPEND.md before restarting it by hand.

wireplumber.components = [
  {
    name = "/usr/local/share/wireplumber/scripts/y700-speaker-suspend.lua", type = script/lua
    provides = hooks.node.y700-speaker-suspend
  }
  {
    type = virtual, provides = custom.y700-audio
    wants = [ hooks.node.y700-speaker-suspend ]
  }
]

wireplumber.profiles = {
  main = {
    custom.y700-audio = required
  }
}

# Optional, NOT part of the fix (SUSPEND.md 5.3): a shorter idle-to-close time for the speaker sink only.
# Stock is 5 s (node/suspend-node.lua). Shorter = the amplifiers and the DSP graph are on for less time
# after every sound, but two sounds further apart than this re-open the PCM and restart both amplifiers
# (first-sound latency every time). The script above follows whatever value is set here.
