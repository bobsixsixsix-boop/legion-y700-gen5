# y700: autologin starts PipeWire ~5 s before the ADSP brings up the sound card.
# tb323fu-speaker-gain then finds no card, exits 0, and the amplifiers stay at
# the safe attenuation (159, -16 dB) for the whole session. Wait for the card
# and for the system's tb323fu-audio.service (which sets 159 again after
# alsa-restore) before opening the amplifiers.
[Service]
TimeoutStartSec=120
ExecStartPre=/usr/local/libexec/y700-wait-sound-card
