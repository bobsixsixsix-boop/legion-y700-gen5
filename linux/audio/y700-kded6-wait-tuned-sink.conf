# /etc/systemd/user/plasma-kded6.service.d/y700-wait-tuned-sink.conf (2026-10-17)
# kded6 hosts plasma-pa's audioshortcutsservice: the VOLUME KEYS. Its PulseAudioQt state is made at kded6's start; on
# the 2026-10-16 19:08 boot kded6 started at :35, while the default sink was still the boot-time "Speakers" stage, and
# the guard switched it to the Lenovo tuning sink at :39 - right as that sink was being created. kded6 never picked
# the change up (it follows later default changes fine, tested 00:2x), so the keys moved the fixed-100 % stage all
# night ("I lower the volume and it jumps back to full", the third time). The 10-16 fix had put this wait on
# plasmashell only (POPS.md item 6 had already said the keys live in kded). Waits <= 12 s; kded6 is ordered before
# plasma-core.target, so the desktop appears that much later (~4 s on the 19:08 boot).
# Undo: rm this file; systemctl --user daemon-reload (takes effect at the next login).
[Service]
ExecStartPre=-/usr/local/libexec/y700-wait-tuned-sink
