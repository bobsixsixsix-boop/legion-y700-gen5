# OPTIONAL, not installed by default (y700/linux/net/KMSG-WATCH.md section 7): a slow safety net under
# y700-kmsg-watch. The same file goes to BOTH
#   /etc/systemd/system/y700-wifi-watchdog.timer.d/y700-safety.conf
#   /etc/systemd/system/y700-display-watchdog.timer.d/y700-safety.conf
# then: systemctl daemon-reload; systemctl enable --now y700-wifi-watchdog.timer y700-display-watchdog.timer
# Each timer then runs its script every 15 min instead of every minute (OnUnitActiveSec counts from the last start
# of the service, so a start by y700-kmsg-watch also pushes it back). The patched y700-checklist accepts an enabled
# timer only when this drop-in is there.
# ONE empty assignment, first: an empty value of ANY OnXxxSec=/OnCalendar= resets the WHOLE timer list
# (man systemd.timer; src/core/load-fragment.c config_parse_timer -> timer_free_values). A second reset after
# OnBootSec=15min would drop it again, leaving OnUnitActiveSec= alone, which never elapses before the service's
# first start (src/core/timer.c, TIMER_UNIT_ACTIVE: base <= 0 -> continue) -- i.e. it would never fire on a boot
# where the watcher is dead from the start, the one case this net is for.
[Timer]
OnBootSec=
OnBootSec=15min
OnUnitActiveSec=15min
AccuracySec=1min
